appId: ch.resonlab.acustika
productName: Acustika
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - build/icon.png
  - package.json
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
linux:
  icon: build/icon.png
  category: AudioVideo
  # Un paquet Debian exige un mainteneur avec une adresse e-mail, sinon la
  # construction du .deb echoue. Cette valeur est inscrite dans le paquet et
  # visible de tous ceux qui le telechargent.
  maintainer: ResonLab <resonlab@proton.me>
  synopsis: Simulation acoustique et conseil de placement
  description: >-
    Couverture sonore d'une salle : zones, pentes, bibliotheque d'enceintes. Toutes les donnees restent sur la machine.
  desktop:
    entry:
      Name: Acustika
      Comment: Couverture sonore et placement d enceintes
  target:
    # AppImage : un seul fichier executable, sans installation, et le seul
    # format Linux que l'auto-updater sait mettre a jour.
    - target: AppImage
      arch:
        - x64
    # deb : pour installer proprement sur Debian et Ubuntu (pas d'auto-update).
    - target: deb
      arch:
        - x64
publish:
  - provider: github
    owner: ResonLab
    repo: acustika
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Acustika
  uninstallDisplayName: Acustika
  deleteAppDataOnUninstall: false
